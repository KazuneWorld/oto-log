<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <footer>
        <a th:href="@{/timeline}"><img th:src="@{/images/home.png}" alt="ホーム" style="width: 40px; height: 40px;"></a>
        <a th:href="@{/bookmarks}"><img th:src="@{/images/bookmark.png}" alt="ブックマーク" style="width: 40px; height: 40px;"></a>
        <a th:href="@{/newpost}"><img th:src="@{/images/newpost.png}" alt="新規投稿" style="width: 40px; height: 40px;"></a>
        <a th:href="@{/notifications}"><img th:src="@{/images/notification.png}" alt="通知" style="width: 40px; height: 40px;">
            <span class="notification-badge"
            th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
            th:text="${unreadNotificationCount > 20 ? '20+' : unreadNotificationCount}"
            th:attr="aria-label=|未読${unreadNotificationCount}件|"></span>
        </a>
        <a th:href="@{/{id}(id=${userInfo.userId})}"><img th:src="@{/images/mypage.png}" alt="マイページ" style="width: 40px; height: 40px;"></a>
    </footer>
</body>
</html>
