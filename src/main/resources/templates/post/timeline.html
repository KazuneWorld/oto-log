<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タイムライン</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>タイムライン</h1>


    <div class="post" th:each="post : ${friendPosts}">
        <span th:text="${post.userIcon}">ユーザアイコン</span>
        <span th:text="${post.userNickname}">ユーザニックネーム</span>
        <span th:text="${post.trackname}">曲名</span>
        <span th:text="${post.tagName}">気分タグ</span>
        <a th:href="${post.previewUrl}" th:text="${post.previewUrl}" >プレビューリンク</a>
        <a th:href="${post.appleMusicUrl}"  th:text="${post.appleMusicUrl}">AppleMusicリンク</a>
    </div>
        

    <!-- フッター部分を読み込む -->
    <div th:replace="~{footer :: footer}"></div>
</body>

</html>
