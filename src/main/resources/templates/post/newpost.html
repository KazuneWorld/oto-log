<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ビューポートの設定。スマホでの表示に必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- PWA用の共通フラグメントを読み込む。 -->
    <th:block th:replace="~{pwa-head :: pwaHead}"></th:block>
    <title>投稿</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>投稿</h1>
    <!-- この部分に選択した音楽のジャケ写を表示させる -->

    <h3>気分タグ</h3>
    <!-- タグ名一覧を表示 -->
    <form th:action="@{/timeline}" method="post">
        <div th:each="moodtag : ${moodTags}">
            <input type="radio" name="moodTagId" th:value="${moodtag.moodTagId}" required>
            <label th:text="${moodtag.tagName}"></label>
        </div>
        <input type="submit" value="投稿する">
    </form>

    <a th:href="@{/timeline}">戻る</a>
    

    
</body>

</html>
