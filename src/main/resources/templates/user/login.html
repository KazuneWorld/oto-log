<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ビューポートの設定。スマホでの表示に必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- PWA用の共通フラグメントを読み込む。 -->
    <th:block th:replace="~{pwa-head :: pwaHead}"></th:block>
    <title>ログイン</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    <h1>ログインページ</h1>

    <!-- ログイン失敗時のエラーメッセージ -->
    <p th:if="${param.error}" style="color: red;">
        メールアドレス（またはログインID）かパスワードが正しくありません。
    </p>

    <!-- 開発中のログイン省略のためvalueにユーザーをセットしています -->
    <form th:action="@{/user/login}" method="post">

        <label for="userEmail">メールアドレスまたはログインID</label>
        <input type="text" id="userEmail" name="userEmail" value="example1@example.com" required>

        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" value="1234" required>

        <button type="submit">ログイン</button>
        
    </form>
    
</body>

</html>
