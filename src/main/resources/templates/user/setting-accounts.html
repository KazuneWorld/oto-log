<!DOCTYPE html>
<!--html xmlns:th="http://www.thymeleaf.org"-->
<html>

<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <link rel="stylesheet" th:href="@{/css/setting-accounts.css}">
</head>
<body>

    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>ユーザー情報変更</h1>
    <p>変更する情報以外も入力してください（仮）</p>
    <form th:action="@{/user/settings}" method="post">
        <label for="email">メールアドレス:</label>
        <input type="email" id="email" name="email">
        <!-- th:value="${user.email}" required-->
        <label for="password">パスワード:</label>
        <input type="password" id="password" name="password">
        <!-- th:value="${user.password}" required-->
        <label for="password-confirm">パスワード（確認）</label>
        <input type="password" id="password-confirm" name="password-confirm" required>
        <p id="message"></p>
        <label for="username">ニックネーム:</label>
        <input type="text" id="username" name="username">
        <!-- th:value="${user.username}" required-->
        <button type="submit">変更</button>
    </form>

    <script>
        const password = document.getElementById("password");
        const passwordConfirm = document.getElementById("password-confirm");
        const message = document.getElementById("message");
        
        passwordConfirm.addEventListener("input", function () {
        if (password.value === passwordConfirm.value) {
            message.textContent = "パスワードが一致しています";
            message.style.color = "green";
        } else {
            message.textContent = "パスワードが一致していません";
            message.style.color = "red";
        }
        });
</script>
</body>
</html>
