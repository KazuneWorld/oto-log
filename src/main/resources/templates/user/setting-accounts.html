<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ビューポートの設定。スマホでの表示に必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- PWA用の共通フラグメントを読み込む。 -->
    <th:block th:replace="~{pwa-head :: pwaHead}"></th:block>
    <title>アカウント設定</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>
<body>

    <!--機能実装担当者さんへ
    
        ・ニックネームを一番最初に移動させて。
        ・その次に、ログイン用IDを変更するテキストボックスも必要。
        ・現在のパスワードを入力させるテキストボックスも必要。

        ※パスワード以外は現在設定中の値を表示させるようにしてね。
    
        終わったらこれ消してね
    -->

    <h1>ユーザー情報変更</h1>
    <form th:action="@{/user/settings}" method="post">
        <label for="email">メールアドレス:</label>
        <input type="email" id="email" name="email" required>
        <!-- th:value="${user.email}" required-->
        <label for="password">パスワード:</label>
        <input type="password" id="password" name="password" required>
        <!-- th:value="${user.password}" required-->
        <label for="password-confirm">パスワード（確認）</label>
        <input type="password" id="password-confirm" name="password-confirm" required>
        <label for="username">ニックネーム:</label>
        <input type="text" id="username" name="username" required>
        <!-- th:value="${user.username}" required-->
        <button type="submit">変更</button>
    </form>

    <!-- ※パスワードの検証はjsではなくサーバー側で行う（unitradeと同じ）-->
     
</body>
</html>
