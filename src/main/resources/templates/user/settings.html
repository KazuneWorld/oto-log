<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <!-- <link rel="stylesheet" th:href="@{/css/settings.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>設定</h1>
    <a href="@{/settings/account}"></a>
    <!-- <a th:href="@{/}">ユーザー情報変更</a> -->
    <!--色は仮-->
    <p>カラーテーマ</p>
    <p><input type="radio" id="color" name="color" value="light" th:checked="${user.color == 'light'}">ライト</p>
    <p><input type="radio" id="color" name="color" value="dark" th:checked="${user.color == 'dark'}">ダーク</p>
    <p><input type="radio" id="color" name="color" value="navy" th:checked="${user.color == 'navy'}">ネイビー</p>
    <button type="submit">変更</button>
	<a th:href="@{/}">ログアウト</a>
</body>
</html>
