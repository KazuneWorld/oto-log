<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ビューポートの設定。スマホでの表示に必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- PWA用の共通フラグメントを読み込む。 -->
    <th:block th:replace="~{pwa-head :: pwaHead}"></th:block>
    <!-- CSRFトークンをmetaタグに埋め込む。 -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title>設定メニュー</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>設定</h1>
    <a th:href="@{/settings/account}">ユーザー情報変更</a>

    <!-- プッシュ通知機能を有効にするには端末ごとの設定が必要なので、
        コメントアウトを解除するだけでは動かない。このページのCSSを作るタイミングになったら教えて -->
    <!-- <section id="push-section" hidden>
        <p>プッシュ通知</p>
        <p id="push-status"></p>
        <button type="button" id="push-enable-button" hidden>プッシュ通知をオンにする</button>
        <button type="button" id="push-disable-button" hidden>プッシュ通知をオフにする</button>
    </section> -->

    <!-- ⚠️余裕があれば実装・色は仮 -->
    <!-- カラーテーマにAppleMusic/Spotify/YouTube風とかあったら面白そう！ -->
    <p>カラーテーマ</p>
    <p><input type="radio" id="color" name="color" value="light" checked>ライト</p>
    <p><input type="radio" id="color" name="color" value="dark" disabled>ダーク</p>
    <p><input type="radio" id="color" name="color" value="navy" disabled>ネイビー</p>
    <button type="submit">変更</button>

    <form th:action="@{/users/logout}" method="post">
        <button type="submit" th:onclick="return confirm('ログアウトしますか？');">ログアウト</button>
    </form>

    <!-- フッター部分を読み込む -->
    <div th:replace="~{footer :: footer}"></div>
    <script th:src="@{/js/push-settings.js}"></script>
</body>
</html>
