<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>

<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <!-- <link rel="stylesheet" th:href="@{/css/settings.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>

    <h1>設定</h1>
    <a th:href="@{/settings/account}">ユーザー情報変更</a>

    <!-- ⚠️余裕があれば実装・色は仮 -->
    <!-- カラーテーマにAppleMusic/Spotify/YouTube風とかあったら面白そう！ -->
    <p>カラーテーマ</p>
    <p><input type="radio" id="color" name="color" value="light" checked>ライト</p>
    <p><input type="radio" id="color" name="color" value="dark" disabled>ダーク</p>
    <p><input type="radio" id="color" name="color" value="navy" disabled>ネイビー</p>
    <button type="submit">変更</button>

    <form th:action="@{/users/logout}" method="post">
        <button type="submit" th:onclick="return confirm('ログアウトしますか？');">ログアウト</button>
    </form>

    <!-- フッター部分を読み込む -->
    <div th:replace="~{footer :: footer}"></div>
</body>
</html>
