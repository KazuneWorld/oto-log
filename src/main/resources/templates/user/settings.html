<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>設定</title>
    <!-- <link rel="stylesheet" th:href="@{/css/settings.css}"> -->
</head>

<body>
    <h1>設定</h1>
    <details>
        <!-- アコーディオンメニューを開いたら変更できるようになる -->
        <summary>ユーザー情報変更</summary>
        <form th:action="@(/user/update)" method="post">
            <label for="username">ユーザー名:</label>
            <input type="text" id="username" name="username" th:value="${user.username}" required>
            <label for="email">メールアドレス:</label>
            <input type="email" id="email" name="email" th:value="${user.email}" required>
            <button type="submit">変更</button>
        </form>
    </details>
    <details>
        <!--色は仮-->
        <summary>カラーテーマ</summary>
        <p><input type="radio" id="color" name="color" value="light" th:checked="${user.color == 'light'}">ライト</p>
        <p><input type="radio" id="color" name="color" value="dark" th:checked="${user.color == 'dark'}">ダーク</p>
        <p><input type="radio" id="color" name="color" value="navy">ネイビー</p>
        <button type="submit">変更</button>
    </details>
    <!-- ↓何か加える必要がある気がする... -->
    <a th:href="@{/}">ログアウト</a>
</body>
</html>
