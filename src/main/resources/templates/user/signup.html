<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>会員登録</title>
</head>

<body>
    <h1>会員登録</h1>

    <form th:action="@{/user/signup}" th:object="${user}" method="post">

        <div>
            <label for="userLoginId">ログインID</label>
            <input type="text" id="userLoginId" th:field="*{userLoginId}" required maxlength="30">
        </div>

        <div>
            <label for="userEmail">メールアドレス</label>
            <input type="email" id="userEmail" th:field="*{userEmail}" required maxlength="255">
        </div>

        <div>
            <label for="userPass">パスワード</label>
            <input type="password" id="userPass" th:field="*{userPass}" required>
        </div>

        <div>
            <label for="userPassConfirm">パスワード（確認用）</label>
            <input type="password" id="userPassConfirm" name="userPassConfirm" required>
        </div>

        <div>
            <label for="userNickname">ニックネーム</label>
            <input type="text" id="userNickname" th:field="*{userNickname}" required maxlength="50">
        </div>

        <button type="submit">登録する</button>

    </form>

    <a th:href="@{/}">トップに戻る</a>

</body>

</html>
