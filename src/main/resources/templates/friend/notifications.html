<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- ビューポートの設定。スマホでの表示に必要 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- PWA用の共通フラグメントを読み込む。 -->
    <th:block th:replace="~{pwa-head :: pwaHead}"></th:block>
    <title>通知</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    <!-- ヘッダー部分を読み込む -->
    <div th:replace="~{header :: header}"></div>
 

 
        <!--/* 通知が1件もない場合 */-->
        <p class="empty-message" th:if="${#lists.isEmpty(notifications)}">通知はまだありません。</p>
 
        <!--/*
            通知の一覧(新しい順)。行全体がリンクになっていて、タップすると通知の対象の画面へ移動する。
            n.read は「この画面を開く前」の状態なので、false のものが未読(強調表示する)。
            n.message / n.linkUrl は、通知の種類に応じた文言と遷移先(Notificationエンティティが組み立てる)。
        */-->
        <ul class="notification-list" th:unless="${#lists.isEmpty(notifications)}">
            <li th:each="n : ${notifications}">
                <a class="notification-item" th:classappend="${!n.read} ? 'unread'" th:href="@{${n.linkUrl}}">
 
                    <!--/* 送り主のアイコン。NULLの場合はデフォルトアイコンにフォールバック */-->
                    <span class="avatar" aria-hidden="true">
                        <img th:src="${n.senderIcon != null} ? @{|/images/usericons/${n.senderIcon}|} : @{/images/defaulticon.png}" alt="ユーザーアイコン" style="width: 40px; height: 40px;">
                    </span>
 
                    <span class="notification-body">
                        <span class="notification-message" th:text="${n.message}"></span>
                        <span class="notification-time" th:text="${#temporals.format(n.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                    </span>
 
                </a>
            </li>
        </ul>
 
    <!-- フッター部分を読み込む -->
    <div th:replace="~{footer :: footer}"></div>
</body>

</html>
