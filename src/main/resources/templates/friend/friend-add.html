<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>フレンド追加</title>
    <!-- <link rel="stylesheet" th:href="@{/css/.css}"> -->
</head>

<body>
    
    <h1>フレンド追加</h1>

    <!-- ============================================ -->
    <!-- ① コードで探す -->
    <!-- ============================================ -->

    <!-- フレンドコードを入力するフォーム -->
    <form th:action="@{#}" method="post">
        <input type="text" id="friendCode" name="friendCode" placeholder="フレンドコードを入力" required>
        <button type="submit">検索</button>
    </form>
    <!-- 見つからなかった場合のエラーメッセージもここら辺に表示させる↓-->
     <p>見つかりませんでした</p>
    <!-- 一旦この下に検索結果の表示↓ -->
     <p>ここに検索結果</p>
    <!-- アイコンとニックネーム、申請ボタンを表示。
     押すと、前のページ（/friend/requests）に戻る -->
    <p>（ここにアイコンとニックネーム、申請ボタン）</p>




     





    <!-- ============================================ -->
    <!-- ② QRコードを読み取る -->
    <!-- ============================================ -->
    <p>QRコードを読み取る</p>
    <p>ここにカメラ起動ボタン</p>
    <!-- ============================================ -->
    <!-- ③ マイQRコード -->
    <!-- ============================================ -->
    <p>マイQRコード</p>
    <p>ここにマイQRコード表示</p>

</body>

</html>
