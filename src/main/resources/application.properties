spring.application.name=otolog

#データベースへの接続URL
spring.datasource.url=jdbc:mysql://localhost:3306/otolog?serverTimezone=Asia/Tokyo

#データベースへの接続時のユーザー名
spring.datasource.username=root

#データベースへの接続時のパスワード ここでは未指定
spring.datasource.password=

#Log表示設定
logging.level.com.example.webapp.repository=debug

#SQLスクリプトの初期化モードを設定
spring.sql.init.mode=always

#MyBatisのMapper XMLファイルの場所を指定
mybatis.mapper-locations=classpath:mapper/*.xml

#プッシュ通知のVAPID鍵の設定。環境変数 PUSH_VAPID_PUBLIC_KEY と PUSH_VAPID_PRIVATE_KEY から取得する。
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
# 連絡先(プッシュサービスが、問題があった時に連絡できるようにするためのもの)。
push.vapid.subject=${PUSH_VAPID_SUBJECT:https://github.com/KazuneWorld}