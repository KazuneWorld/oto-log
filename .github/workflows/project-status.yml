name: Update project status
on:
  create:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

jobs:
  update:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'create' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.state == 'open')
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      EVENT: ${{ github.event_name }}
      BRANCH: ${{ github.ref_name }}
      PR_ID: ${{ github.event.pull_request.node_id }}
    steps:
      - name: Move linked issues
        run: |
          if [ "$EVENT" = "create" ]; then
            STATUS="進行中"
            NUMS=$(echo "$BRANCH" | grep -oE '^[0-9]+' || true)
          else
            STATUS="レビュー中"
            NUMS=$(gh api graphql -f query='
              query($id:ID!){ node(id:$id){ ... on PullRequest{
                closingIssuesReferences(first:10){ nodes{ number } } } } }' \
              -f id="$PR_ID" \
              --jq '.data.node.closingIssuesReferences.nodes[].number')
          fi

          for N in $NUMS; do
            gh api graphql -f query='
              query($o:String!,$r:String!,$n:Int!){
                repository(owner:$o,name:$r){ issue(number:$n){
                  projectItems(first:5){ nodes{ id project{ id } } } } }
              }' -f o="$OWNER" -f r="$REPO" -F n="$N" \
              --jq '.data.repository.issue.projectItems.nodes[] | "\(.id) \(.project.id)"' |
            while read -r ITEM_ID PROJECT_ID; do
              FIELD=$(gh api graphql -f query='
                query($p:ID!){ node(id:$p){ ... on ProjectV2{
                  field(name:"Status"){ ... on ProjectV2SingleSelectField{
                    id options{ id name } } } } } }' \
                -f p="$PROJECT_ID" --jq '.data.node.field')
              FIELD_ID=$(echo "$FIELD" | jq -r .id)
              OPT_ID=$(echo "$FIELD" | jq -r --arg s "$STATUS" '.options[] | select(.name==$s) | .id')
              [ -z "$OPT_ID" ] && continue

              gh api graphql -f query='
                mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                  updateProjectV2ItemFieldValue(input:{
                    projectId:$p,itemId:$i,fieldId:$f,
                    value:{singleSelectOptionId:$o}}){ projectV2Item{ id } }
                }' -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$FIELD_ID" -f o="$OPT_ID"
            done
          done
